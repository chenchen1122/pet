<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ pet.name }} - 电子宠物小狗</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <!-- 顶部：名字 + 形象/配饰切换 -->
        <header class="header">
            <div class="name-area">
                <h1 id="pet-name">{{ pet.name }}</h1>
                <button class="btn-edit" id="btn-edit-name" title="修改名字">✏️</button>
                <div class="edit-name-form hidden" id="edit-name-form">
                    <input type="text" id="name-input" maxlength="20" placeholder="新名字">
                    <button class="btn-save" id="btn-save-name">保存</button>
                    <button class="btn-cancel" id="btn-cancel-edit">取消</button>
                </div>
            </div>
            <div class="controls">
                <select id="breed-select" title="切换形象">
                    <option value="beagle" {% if pet.breed == 'beagle' %}selected{% endif %}>比格犬</option>
                    <option value="pomeranian" {% if pet.breed == 'pomeranian' %}selected{% endif %}>博美</option>
                    <option value="shiba" {% if pet.breed == 'shiba' %}selected{% endif %}>柴犬</option>
                </select>
                <div class="accessory-btns">
                    <button class="acc-btn {% if pet.accessory == 'none' %}active{% endif %}" data-acc="none" title="无">🐾</button>
                    <button class="acc-btn {% if pet.accessory == 'hat' %}active{% endif %}" data-acc="hat" title="帽子">🎩</button>
                    <button class="acc-btn {% if pet.accessory == 'scarf' %}active{% endif %}" data-acc="scarf" title="围巾">🧣</button>
                    <button class="acc-btn {% if pet.accessory == 'glasses' %}active{% endif %}" data-acc="glasses" title="眼镜">👓</button>
                </div>
            </div>
        </header>

        <!-- 主区域：宠物Canvas + 状态条 -->
        <main class="main">
            <div class="pet-area">
                <canvas id="pet-canvas" width="400" height="350"></canvas>
                <div id="action-overlay" class="action-overlay hidden"></div>
            </div>

            <div class="status-area">
                <div class="status-bar">
                    <span class="status-icon">⚡</span>
                    <span class="status-label">体力</span>
                    <div class="bar-wrap"><div class="bar energy" id="bar-energy" style="width: {{ pet.energy }}%"></div></div>
                    <span class="status-val" id="val-energy">{{ pet.energy }}</span>
                </div>
                <div class="status-bar">
                    <span class="status-icon">😊</span>
                    <span class="status-label">开心值</span>
                    <div class="bar-wrap"><div class="bar happiness" id="bar-happiness" style="width: {{ pet.happiness }}%"></div></div>
                    <span class="status-val" id="val-happiness">{{ pet.happiness }}</span>
                </div>
                <div class="status-bar">
                    <span class="status-icon">✨</span>
                    <span class="status-label">清洁度</span>
                    <div class="bar-wrap"><div class="bar cleanliness" id="bar-cleanliness" style="width: {{ pet.cleanliness }}%"></div></div>
                    <span class="status-val" id="val-cleanliness">{{ pet.cleanliness }}</span>
                </div>
                <div class="growth-info">
                    成长值: <span id="val-growth">{{ pet.growth }}</span>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="action-btns" id="action-btns">
                <button class="action-btn feed" id="btn-feed" title="喂食">🍖 喂食</button>
                <button class="action-btn play" id="btn-play" title="玩耍">🎾 玩耍</button>
                <button class="action-btn bathe" id="btn-bathe" title="洗澡">🛁 洗澡</button>
                <button class="action-btn sleep" id="btn-sleep" title="睡觉">😴 睡觉</button>
                <button class="action-btn game" id="btn-game" title="接球游戏">🎯 接球</button>
            </div>
        </main>

        <!-- 心情日记侧边栏 -->
        <aside class="diary-sidebar">
            <h3>📔 心情日记</h3>
            <ul id="diary-list">
                {% for entry in pet.diary[-5:]|reverse %}
                <li class="diary-item"><span class="diary-time">{{ entry.time }}</span> {{ entry.msg }}</li>
                {% endfor %}
            </ul>
        </aside>

        <!-- 随机事件提示 -->
        <div id="event-toast" class="event-toast hidden"></div>
    </div>

    <!-- 接球游戏覆盖层 -->
    <div id="game-overlay" class="game-overlay hidden">
        <div class="game-box">
            <h3>🎯 接球游戏</h3>
            <canvas id="game-canvas" width="400" height="300"></canvas>
            <p class="game-hint">点击屏幕扔出飞盘，看小狗能不能接住！</p>
            <button class="btn-close-game" id="btn-close-game">关闭</button>
        </div>
    </div>

    <script>
        // 传递给 JS 的初始数据
        window.PET_INIT = {{ pet | tojson | safe }};
    </script>
    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
